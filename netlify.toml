[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # VAPID public key (safe to commit — it's public)
  # Must match VAPID_PRIVATE_KEY set in Netlify dashboard → Site settings → Env vars
  VITE_VAPID_PUBLIC_KEY = "BLCYTzUfRwLnnYU3OgbavY22ebjf8TZRFj-D0D1RdcBbtfclNBf7900NemlFZ62DgHaANxEg2tERuPXQXK4A2xU"
  VAPID_SUBJECT         = "mailto:admin@taskpro.app"
  VITE_SUPABASE_URL = "https://scixtscuoyhjsnpzvbvm.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_aoAEihnFjLkRISPgC7dI3Q_ULkybnEo"
  # VAPID_PRIVATE_KEY → set in Netlify dashboard only (never commit)

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
